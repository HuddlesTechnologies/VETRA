<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password · VETRA</title>
    <link rel="stylesheet" href="vetra-tokens.css" />
    <script src="theme.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div class="frame">
      <div class="topbar">
        <a href="index.html" class="status logo"><span class="vetra-logo"><img class="logo-img logo-for-light" src="assets/brand/logo-full.png" alt="VETRA" /><img class="logo-img logo-for-dark" src="assets/brand/logo-full-white.png" alt="" aria-hidden="true" /></span></a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>

      <div class="panel-wrap">
        <div class="panel">
          <h1 class="title">Reset your <span class="highlight">password</span></h1>
          <p class="subtitle" id="reset-subtitle">Choose a new password for your account.</p>

          <div class="form-grid" id="reset-form-wrap">
            <div class="field field-full">
              <label for="new-password">New password</label>
              <div class="input-wrap">
                <input id="new-password" type="password" placeholder="At least 8 characters" />
              </div>
            </div>
            <div class="field field-full">
              <label for="confirm-password">Confirm new password</label>
              <div class="input-wrap">
                <input id="confirm-password" type="password" placeholder="Re-enter new password" />
              </div>
            </div>
          </div>

          <p class="form-error" id="reset-error" hidden style="color:var(--c-red);font-size:13px;margin:0 0 12px;"></p>
          <p class="form-error" id="reset-success" hidden style="color:var(--c-green);font-size:13px;margin:0 0 12px;"></p>

          <button class="continue-btn" type="button" id="reset-submit-btn">
            Reset password <span class="btn-arrow">→</span>
          </button>

          <p class="footer-text" id="reset-request-new" hidden>
            <a href="forgot-password.html">Request a new reset link</a>
          </p>
          <p class="footer-text">
            <a href="signin.html">Back to sign in</a>
          </p>
        </div>
      </div>
      <p class="built-by-strip"><a class="built-by" href="https://huddlestechnologies.com" target="_blank" rel="noopener">Built by Huddles Technologies</a></p>
    </div>
    <script src="api-client.js"></script>
    <script src="password-toggle.js"></script>
    <script>
      (function () {
        const token = new URLSearchParams(window.location.search).get("token");
        const formWrap = document.getElementById("reset-form-wrap");
        const submitBtn = document.getElementById("reset-submit-btn");
        const errorEl = document.getElementById("reset-error");
        const successEl = document.getElementById("reset-success");
        const subtitleEl = document.getElementById("reset-subtitle");

        function showError(message) {
          errorEl.textContent = message;
          errorEl.hidden = false;
        }

        if (!token) {
          subtitleEl.textContent = "This reset link is missing its token.";
          formWrap.hidden = true;
          submitBtn.hidden = true;
          showError("Open the link from your email again, or request a new one.");
          document.getElementById("reset-request-new").hidden = false;
          return;
        }

        submitBtn.addEventListener("click", async () => {
          errorEl.hidden = true;
          const newPassword = document.getElementById("new-password").value;
          const confirmPassword = document.getElementById("confirm-password").value;

          if (!newPassword || newPassword.length < 8) {
            showError("New password must be at least 8 characters.");
            return;
          }
          if (newPassword !== confirmPassword) {
            showError("New password and confirm password don't match.");
            return;
          }

          submitBtn.textContent = "Resetting…";
          submitBtn.disabled = true;
          try {
            await VetraAPI.request("/auth/reset-password", {
              method: "POST",
              body: { token, newPassword },
            });
            formWrap.hidden = true;
            submitBtn.hidden = true;
            subtitleEl.textContent = "Your password has been reset.";
            successEl.textContent = "You can now sign in with your new password.";
            successEl.hidden = false;
          } catch (err) {
            showError(err.message);
            document.getElementById("reset-request-new").hidden = false;
            submitBtn.textContent = "Reset password";
            submitBtn.disabled = false;
          }
        });
      })();
    </script>
      <script src="back-button.js"></script>
  </body>
</html>
