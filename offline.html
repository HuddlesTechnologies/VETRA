<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline, VETRA</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/vetra-tokens.css" />
    <script src="/theme.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--c-bg);
        color: var(--c-text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 360px; }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 18px;
        border-radius: 18px; display: grid; place-items: center;
        background: var(--c-accent-tint); color: var(--c-accent);
      }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; color: var(--c-text-2); line-height: 1.5; font-size: 15px; }
      button {
        border: 0; border-radius: 999px; padding: 12px 26px;
        font: inherit; font-weight: 600; cursor: pointer;
        background: var(--c-accent-fill); color: var(--c-on-accent);
      }
      button:hover { background: var(--c-accent-hover); }
    </style>
    <link rel="stylesheet" href="/glass.css" />
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg>
      </div>
      <h1>You're offline</h1>
      <p>VETRA needs a connection to load this page. Check your data or Wi‑Fi, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
