<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VETRA · Rider Sign In</title>
    <link rel="stylesheet" href="../vetra-tokens.css" />
    <script src="../theme.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="../vendor/assets/style.css" />
    <link rel="stylesheet" href="assets/rider.css" />
  </head>
  <body class="rider-body">
    <!-- Way back to the main site; the appearance button (theme.js) joins the links. -->
    <header class="rider-auth-bar">
      <a href="../index.html" class="rider-auth-home" aria-label="VETRA home"><span class="vetra-logo"><img class="rider-header-logo logo-for-light" src="../assets/brand/logo-full.png" alt="VETRA" /><img class="rider-header-logo logo-for-dark" src="../assets/brand/logo-full-white.png" alt="" aria-hidden="true" /></span></a>
      <nav class="rider-auth-nav" aria-label="Main site">
        <a href="../index.html">Home</a>
        <a href="../about.html" class="rider-auth-secondary">About</a>
        <a href="../contact.html" class="rider-auth-secondary">Contact</a>
        <a href="../customer/dashboard.html" class="rider-auth-shop">Shop</a>
      </nav>
    </header>
    <main class="rider-auth">
      <form class="rider-card rider-auth-card" id="rider-login-form" novalidate>
        <h1>Rider sign in</h1>
        <p class="rider-muted">Use the email VETRA dispatch registered you with. New riders set a password from the link in their welcome email.</p>
        <label class="rider-field">
          <span>Email</span>
          <input id="rider-email" type="email" autocomplete="email" required />
        </label>
        <label class="rider-field">
          <span>Password</span>
          <input id="rider-password" type="password" autocomplete="current-password" required />
        </label>
        <p class="rider-error" id="rider-login-error" hidden></p>
        <button class="rider-btn primary block" type="submit" id="rider-login-btn">Sign in</button>
      </form>
    </main>

    <script src="../api-client.js"></script>
    <script>
      (function () {
        // Already signed in on this device: straight to jobs.
        if (VetraAPI.getToken("rider")) {
          window.location.replace("index.html");
          return;
        }
        const form = document.getElementById("rider-login-form");
        const errorEl = document.getElementById("rider-login-error");
        const btn = document.getElementById("rider-login-btn");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          errorEl.hidden = true;
          const email = document.getElementById("rider-email").value.trim();
          const password = document.getElementById("rider-password").value;
          if (!email || !password) {
            errorEl.textContent = "Enter your email and password.";
            errorEl.hidden = false;
            return;
          }
          btn.disabled = true;
          btn.textContent = "Signing in…";
          try {
            const result = await VetraAPI.request("/auth/signin", { method: "POST", body: { role: "rider", email, password } });
            if (result.twoFactorRequired) {
              throw new Error("Two-step verification is on for this account. Ask VETRA dispatch to turn it off for rider sign-in.");
            }
            VetraAPI.setSession("rider", result.token, result.user);
            window.location.replace("index.html");
          } catch (err) {
            errorEl.textContent = err.message;
            errorEl.hidden = false;
            btn.disabled = false;
            btn.textContent = "Sign in";
          }
        });
      })();
    </script>
  </body>
</html>
