<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1a2e" />
    <title>VETRA · Rider</title>
    <link rel="stylesheet" href="../vetra-tokens.css" />
    <script src="../theme.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="../vendor/assets/style.css" />
    <link rel="stylesheet" href="assets/rider.css" />
  </head>
  <body class="rider-body">
    <header class="rider-header">
      <span class="vetra-logo"><img class="rider-header-logo logo-for-light" src="../assets/brand/logo-full.png" alt="VETRA" /><img class="rider-header-logo logo-for-dark" src="../assets/brand/logo-full-white.png" alt="" aria-hidden="true" /></span>
      <div class="rider-header-right">
        <span class="rider-header-name" id="rider-name"></span>
        <button type="button" class="rider-link-btn" id="rider-signout">Sign out</button>
      </div>
    </header>

    <main class="rider-main">
      <!-- ID check through Prembly (POST /api/delivery/rider/identity).
           Shown until the rider's ID is verified; a self-signed-up rider
           can't go on duty before then. -->
      <section class="rider-card rider-id-card" id="rider-id-card" hidden>
        <h2 id="rider-id-title">Verify your ID</h2>
        <p class="rider-muted" id="rider-id-intro"></p>
        <p class="rider-id-status" id="rider-id-status" hidden></p>
        <form id="rider-id-form" class="rider-id-card" novalidate>
          <label class="rider-field">
            <span>ID type</span>
            <select id="rider-id-type">
              <option value="nin">NIN (National Identification Number)</option>
              <option value="drivers_license">Driver's licence</option>
              <option value="voters_card">Voter's card (PVC)</option>
            </select>
          </label>
          <label class="rider-field">
            <span id="rider-id-number-label">NIN</span>
            <input id="rider-id-number" autocomplete="off" autocapitalize="characters" spellcheck="false" />
          </label>
          <!-- Driver's licence only: FRSC checks number, date of birth and
               name together. Sent for the check, never stored. -->
          <label class="rider-field" id="rider-id-dob-row" hidden>
            <span>Date of birth (as on your licence)</span>
            <input id="rider-id-dob" type="date" />
          </label>
          <p class="rider-error" id="rider-id-error" hidden></p>
          <button type="submit" class="rider-btn primary block" id="rider-id-submit">Verify ID</button>
        </form>
      </section>

      <!-- Duty toggle + earnings. Going on duty is what makes this rider
           eligible for auto-assigned jobs in their state. -->
      <section class="rider-card rider-duty-card">
        <div class="rider-duty-row">
          <div>
            <p class="rider-duty-label" id="rider-duty-label">Off duty</p>
            <p class="rider-muted" id="rider-duty-hint">Go on duty to receive delivery jobs in your area.</p>
          </div>
          <button type="button" class="rider-switch" id="rider-duty-switch" role="switch" aria-checked="false" aria-label="On duty">
            <span></span>
          </button>
        </div>
        <!-- The state this rider takes jobs in, their own choice
             (PATCH /api/delivery/rider/zone). Locked while they hold a job. -->
        <label class="rider-zone-row" for="rider-zone">
          <span class="rider-muted">Delivery area</span>
          <select id="rider-zone" class="rider-zone-select"></select>
        </label>
        <div class="rider-stats">
          <div><span class="rider-stat-value" id="stat-today">₦0</span><span class="rider-stat-label">Today</span></div>
          <div><span class="rider-stat-value" id="stat-unpaid">₦0</span><span class="rider-stat-label">Pending payout</span></div>
          <div><span class="rider-stat-value" id="stat-delivered">0</span><span class="rider-stat-label">Delivered</span></div>
        </div>
        <p class="rider-location-note" id="rider-location-note" hidden></p>
      </section>

      <div class="rider-tabs" role="tablist">
        <button type="button" class="rider-tab active" data-tab="jobs" role="tab" aria-selected="true">Jobs <span class="rider-tab-count" id="jobs-count" hidden></span></button>
        <button type="button" class="rider-tab" data-tab="history" role="tab" aria-selected="false">History</button>
        <button type="button" class="rider-tab" data-tab="bank" role="tab" aria-selected="false">Bank <span class="rider-tab-dot" id="bank-missing-dot" hidden></span></button>
      </div>

      <section id="tab-jobs" class="rider-list"></section>
      <section id="tab-history" class="rider-list" hidden></section>

      <!-- Where automatic payouts go: each delivery is paid the moment the
           buyer's code is entered. Same rules as the vendor's payout
           account: the name is fetched from the bank, never typed. -->
      <section id="tab-bank" class="rider-list" hidden>
        <article class="rider-card">
          <p class="rider-job-ref">Payout bank account</p>
          <p class="rider-muted" id="bank-current">Loading…</p>
          <form id="bank-form" class="rider-bank-form">
            <label class="rider-field">
              <span>Bank</span>
              <select id="bank-code" required><option value="">Loading banks…</option></select>
            </label>
            <label class="rider-field">
              <span>Account number</span>
              <input id="bank-account-number" inputmode="numeric" maxlength="10" placeholder="10-digit account number" autocomplete="off" required />
            </label>
            <p class="rider-muted" id="bank-resolved">Choose your bank and enter your account number.</p>
            <button type="submit" class="rider-btn primary" id="bank-save" disabled>Save account</button>
          </form>
        </article>
      </section>
    </main>

    <script src="../api-client.js"></script>
    <script src="../shared-ui.js"></script>
    <script src="assets/rider.js"></script>
  </body>
</html>
