<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VETRA · Vendor Dashboard</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar (desktop/web view) -->
      <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-top">
          <span class="sidebar-logo"><img class="sidebar-logo-img" src="../assets/brand/logo-full-white.png" alt="VETRA" /></span>
          <button
            class="sidebar-toggle"
            id="sidebar-collapse-toggle"
            aria-label="Collapse sidebar"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="sidebar-link active">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 10.5 12 3l9 7.5"></path>
              <path d="M5 9.5V21h14V9.5"></path>
            </svg>
            <span>Dashboard</span>
          </a>

          <a href="products.html" class="sidebar-link">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
              ></path>
              <path d="M3.27 6.96 12 12l8.73-5.04"></path>
              <path d="M12 22.08V12"></path>
            </svg>
            <span>Products</span>
          </a>

          <a href="orders.html" class="sidebar-link">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M4 2h16v20l-3-2-3 2-3-2-3 2-3-2-1 2z"></path>
              <path d="M8 7h8M8 11h8M8 15h5"></path>
            </svg>
            <span>Orders</span>
          </a>

          <a href="earnings.html" class="sidebar-link">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
              <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
              <path d="M18 12a2 2 0 0 0 0 4h3v-4z"></path>
            </svg>
            <span>Earnings</span>
          </a>

          <a href="profile.html" class="sidebar-link">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21v-1a8 8 0 0 1 16 0v1"></path>
            </svg>
            <span>Profile</span>
          </a>
        </nav>
      </aside>

      <!-- Floating button to bring the sidebar back after it's fully hidden -->
      <button
        class="sidebar-reopen"
        id="app-sidebar-reopen"
        aria-label="Show sidebar"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <div class="phone">
        <!-- Header (logo, support, notifications) -->
        <header id="app-header">
          <div class="topbar">
            <div style="display: flex; align-items: center">
              <button
                class="header-toggle"
                id="header-sidebar-toggle"
                aria-label="Toggle sidebar"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <line x1="3" y1="6" x2="21" y2="6"></line>
                  <line x1="3" y1="12" x2="21" y2="12"></line>
                  <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
              </button>
              <p class="logo"><img class="logo-img" src="../assets/brand/logo-full-white.png" alt="VETRA" /></p>
            </div>
            <div class="icon-actions">
              <a
                class="icon-btn support-btn"
                id="header-support-btn"
                href="#"
                aria-label="Support"
                ><svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                  <path
                    d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"
                  ></path></svg
              ></a>
              <a
                class="icon-btn"
                href="notifications.html"
                aria-label="Notifications"
                ><svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg
              ></a>
              <a
                class="icon-btn header-avatar"
                href="profile.html"
                aria-label="Your profile"
                ><img src="imgs/avatar-placeholder.svg" alt="" onerror="this.onerror=null;this.src='imgs/avatar-placeholder.svg';"
              /></a>
            </div>
          </div>
        </header>

        <main class="page-shell">
          <div class="vendor-page-header">
            <div>
              <h1>Vendor Dashboard</h1>
              <p>Track your sales, orders, and store performance.</p>
            </div>
            <button class="add-product-btn" id="add-product-btn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Add Product
            </button>
          </div>

          <!-- Filled in by renderVendorStats() (assets/dashboard.js) -->
          <div id="vendor-stats" class="stat-grid"></div>

          <!-- Filled in by renderVendorRecentOrders() (assets/dashboard.js) -->
          <section class="vendor-section" id="vendor-orders">
            <div class="cat-head">
              <h3>RECENT ORDERS</h3>
              <a class="see-more" href="orders.html">See all</a>
            </div>
            <div class="order-list" id="vendor-recent-orders-list">
              <p class="vendor-products-empty">Loading orders…</p>
            </div>
          </section>

          <!-- Filled in by renderVendorProducts() -->
          <section class="vendor-section" id="vendor-products">
            <div class="cat-head">
              <h3>MY PRODUCTS</h3>
              <a class="see-more" href="products.html">See all</a>
            </div>
            <div class="vendor-products-grid" data-limit="6">
              <p class="vendor-products-empty">Loading your products…</p>
            </div>
          </section>
        </main>

        <!-- Bottom nav (mobile view) -->
        <nav class="bottom-nav" id="app-bottomnav">
          <a href="dashboard.html" class="nav-item active">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 10.5 12 3l9 7.5"></path>
              <path d="M5 9.5V21h14V9.5"></path>
            </svg>
            Dashboard

            <span class="dot-indicator"></span>
          </a>

          <a href="products.html" class="nav-item">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
              ></path>
              <path d="M3.27 6.96 12 12l8.73-5.04"></path>
              <path d="M12 22.08V12"></path>
            </svg>
            Products
          </a>

          <a href="orders.html" class="nav-item">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M4 2h16v20l-3-2-3 2-3-2-3 2-3-2-1 2z"></path>
              <path d="M8 7h8M8 11h8M8 15h5"></path>
            </svg>
            Orders
          </a>

          <a href="earnings.html" class="nav-item">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
              <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
              <path d="M18 12a2 2 0 0 0 0 4h3v-4z"></path>
            </svg>
            Earnings
          </a>

          <a href="profile.html" class="nav-item">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21v-1a8 8 0 0 1 16 0v1"></path>
            </svg>
            Profile
          </a>
        </nav>
      </div>
    </div>

    <!-- Add Product modal -->
    <div class="modal-overlay" id="add-product-modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="add-product-title">
        <div class="modal-header">
          <h2 id="add-product-title">Add Product</h2>
          <button type="button" class="modal-close-btn" id="add-product-close" aria-label="Close">✕</button>
        </div>

        <form id="add-product-form" novalidate>
          <div class="modal-body">
            <div class="form-grid">
              <div class="form-group full">
                <label class="form-label" for="ap-name">Product Name</label>
                <input class="form-input" type="text" id="ap-name" name="name" required placeholder="e.g. Oraimo Power Bank 20000mAh" />
              </div>

              <div class="form-group">
                <label class="form-label" for="ap-category">Category</label>
                <select class="form-input" id="ap-category" name="category" required>
                  <option value="" disabled selected>Select category</option>
                  <option>Electronics</option>
                  <option>Phones &amp; Tablets</option>
                  <option>Computing</option>
                  <option>Gaming</option>
                  <option>Appliances</option>
                  <option>Home &amp; Office</option>
                  <option>Fashion</option>
                  <option>Health &amp; Beauty</option>
                  <option>Food</option>
                  <option>Sports</option>
                  <option>Books &amp; Stationery</option>
                  <option>Baby &amp; Kids</option>
                  <option>Automotive &amp; Tools</option>
                  <option>Livestock</option>
                  <option>Other</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="ap-color">Color <span class="form-hint">(optional)</span></label>
                <input class="form-input" type="text" id="ap-color" name="color" placeholder="e.g. Black, Silver" />
              </div>

              <div class="form-group">
                <label class="form-label" for="ap-storage">Storage <span class="form-hint">(optional)</span></label>
                <input class="form-input" type="text" id="ap-storage" name="storage" placeholder="e.g. 128GB, 256GB" />
              </div>

              <div class="form-group">
                <label class="form-label" for="ap-price">Price (₦)</label>
                <input class="form-input" type="text" inputmode="numeric" id="ap-price" name="price" required placeholder="e.g. 17,489" />
              </div>

              <div class="form-group full">
                <label class="form-label" for="ap-stock">Stock Quantity</label>
                <div class="qty-stepper">
                  <button type="button" class="qty-stepper-btn" id="ap-stock-decrement" aria-label="Decrease stock quantity">−</button>
                  <input class="qty-stepper-input" type="number" id="ap-stock" name="stock" min="0" step="1" required value="0" />
                  <button type="button" class="qty-stepper-btn" id="ap-stock-increment" aria-label="Increase stock quantity">+</button>
                </div>
              </div>

              <div class="form-group full">
                <label class="form-label" for="ap-description">Product Description</label>
                <textarea class="form-textarea" id="ap-description" name="description" required placeholder="Describe the product's features, condition, and what's included..."></textarea>
              </div>

              <div class="form-group full">
                <label class="form-label" for="ap-keywords">Search Keywords <span class="form-hint">(up to 5, comma-separated)</span></label>
                <input class="form-input" type="text" id="ap-keywords" name="keywords" placeholder="e.g. wireless, bluetooth, noise cancelling" />
              </div>

              <div class="form-group full">
                <label class="form-label">Product Images <span class="form-hint">(up to 4)</span></label>
                <div class="media-upload-grid" id="ap-image-grid">
                  <label class="media-upload-slot" data-slot-index="0">
                    <input type="file" accept="image/*" class="media-upload-input" data-index="0" hidden />
                    <span class="media-upload-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></span>
                    <span class="media-upload-text">Add photo</span>
                  </label>
                  <label class="media-upload-slot" data-slot-index="1">
                    <input type="file" accept="image/*" class="media-upload-input" data-index="1" hidden />
                    <span class="media-upload-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></span>
                    <span class="media-upload-text">Add photo</span>
                  </label>
                  <label class="media-upload-slot" data-slot-index="2">
                    <input type="file" accept="image/*" class="media-upload-input" data-index="2" hidden />
                    <span class="media-upload-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></span>
                    <span class="media-upload-text">Add photo</span>
                  </label>
                  <label class="media-upload-slot" data-slot-index="3">
                    <input type="file" accept="image/*" class="media-upload-input" data-index="3" hidden />
                    <span class="media-upload-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></span>
                    <span class="media-upload-text">Add photo</span>
                  </label>
                </div>
              </div>

              <div class="form-group full">
                <label class="form-label">Product Video <span class="form-hint">(1, optional)</span></label>
                <div class="video-upload-row">
                  <label class="media-upload-slot video-upload-slot" id="ap-video-slot">
                    <input type="file" accept="video/*" class="media-upload-input" id="ap-video-input" hidden />
                    <span class="media-upload-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg></span>
                    <span class="media-upload-text">Add video</span>
                    <span class="video-file-chip">
                      <span class="media-upload-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg></span>
                      <span class="video-file-name"></span>
                      <button type="button" class="media-remove-btn" id="ap-video-remove" aria-label="Remove video">✕</button>
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-cancel" id="add-product-cancel">Cancel</button>
              <button type="submit" class="btn btn-save">Add Product</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="../api-client.js"></script>
    <script src="../shared-ui.js"></script>
    <script src="assets/interactions.js"></script>
    <script src="assets/ui.js"></script>
    <script src="assets/products-data.js"></script>
    <script src="assets/add-product.js"></script>
    <script src="assets/product-actions.js"></script>
    <script src="assets/dashboard.js"></script>

    <script src="assets/support.js"></script>
  </body>
</html>
