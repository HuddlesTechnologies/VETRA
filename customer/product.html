          <div id="product-detail-content">
            <div class="product-detail-grid">
              <div class="product-detail-image">
                <img id="pd-image" src="" alt="" />
              </div>
              <div class="product-detail-info">
                <p class="page-kicker" id="pd-category">—</p>
                <h1 id="pd-name">—</h1>
                <p class="product-detail-price" id="pd-price">—</p>
                <p class="product-detail-loc" id="pd-location" hidden></p>
                <a class="product-detail-vendor" id="pd-vendor-link" href="#" hidden>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1.5-5h15L21 9"></path><path d="M4 9v10a1 1 0 0 0 1 1h4v-6h6v6h4a1 1 0 0 0 1-1V9"></path></svg>
                  Sold by <span id="pd-vendor-name"></span>
                </a>

                <p class="product-detail-desc" id="pd-description"></p>

                <div class="product-detail-actions">
                  <div class="cart-item-actions">
                    <button class="qty-btn" type="button" id="pd-qty-decrement">−</button>
                    <span id="pd-qty">1</span>
                    <button class="qty-btn" type="button" id="pd-qty-increment">+</button>
                  </div>
                  <!-- Deliberately not class="add-cart" — that class is what
                       assets/interactions.js's global delegated handler
                       matches, which expects a `[data-product-id]` ancestor
                       card and falls back to navigating to cart.html when
                       there isn't one. This button already has its own
                       handler below (it knows its product from the page's
                       own ?id= query param, not a card), so reusing that
                       class here double-fired both handlers and the global
                       one's fallback nav.href'd the page away entirely. -->
                  <button class="primary-btn" type="button" id="pd-add-to-cart">Add to Cart</button>
                </div>
              </div>
            </div>

            <!-- Reviews — same pattern as store.html's, scoped to this one
                 product instead of a vendor. The "write a review" form is
                 gated on a real (if backend-less) purchase check — see
                 assets/purchase-history.js — rather than accepting a
                 review from anyone; store.html's script has the fuller
                 explanation of the "Verified purchase" tag every listed
                 review still carries, since a review submitted here
                 can't retroactively re-verify itself the same way. -->
            <div class="products-section store-reviews-section">
              <div class="cat-head">
                <h3>REVIEWS</h3>
              </div>
              <div class="review-summary" id="review-summary"></div>
              <div class="review-list" id="reviewList"></div>

              <div class="page-card review-form-card">
                <h3>Write a review</h3>
                <p class="review-form-hint" id="review-form-hint">You can only review a product after a completed order.</p>
                <form id="review-form" hidden>
                  <div class="field-group">
                    <label class="form-label" style="display:block; margin-bottom:6px;">Your rating</label>
                    <div class="star-input" id="star-input" data-value="0">
                      <button type="button" class="star-btn" data-star="1" aria-label="1 star">★</button>
                      <button type="button" class="star-btn" data-star="2" aria-label="2 stars">★</button>
                      <button type="button" class="star-btn" data-star="3" aria-label="3 stars">★</button>
                      <button type="button" class="star-btn" data-star="4" aria-label="4 stars">★</button>
                      <button type="button" class="star-btn" data-star="5" aria-label="5 stars">★</button>
                    </div>
                  </div>
                  <div class="field-group">
                    <label for="review-text">Your review</label>
                    <textarea id="review-text" rows="3" placeholder="Share how your order went..."></textarea>
                  </div>
                  <button class="primary-btn" type="submit">Submit review</button>
                </form>
              </div>
            </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const product = id ? getProduct(id) : null;

        if (!product) {
          document.getElementById('product-not-found').hidden = false;
          document.getElementById('product-detail-content').hidden = true;
          return;
        }

        document.title = `VETRA · ${product.name}`;
        document.getElementById('pd-image').src = product.image;
        document.getElementById('pd-image').alt = product.name;
        document.getElementById('pd-category').textContent = product.category || 'Product';
        document.getElementById('pd-name').textContent = product.name;
        document.getElementById('pd-price').textContent = `₦${product.price.toLocaleString('en-NG')}`;
        document.getElementById('pd-description').textContent = product.description || '';

        const locEl = document.getElementById('pd-location');
        if (product.location) {
          locEl.hidden = false;
          locEl.textContent = product.location;
        }

        const vendorLink = document.getElementById('pd-vendor-link');
        if (product.vendorId && typeof PRODUCT_VENDOR_NAMES !== 'undefined' && PRODUCT_VENDOR_NAMES[product.vendorId]) {
          vendorLink.hidden = false;
          vendorLink.href = `store.html?vendor=${product.vendorId}`;
          document.getElementById('pd-vendor-name').textContent = PRODUCT_VENDOR_NAMES[product.vendorId];
        }

        document.getElementById('product-back-btn').addEventListener('click', () => {
          if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
            window.history.back();
          } else {
            window.location.href = 'explore.html';
          }
        });

        // ---- Quantity stepper + Add to Cart ----
        let qty = 1;
        const qtyEl = document.getElementById('pd-qty');
        document.getElementById('pd-qty-decrement').addEventListener('click', () => {
          qty = Math.max(1, qty - 1);
          qtyEl.textContent = qty;
        });
        document.getElementById('pd-qty-increment').addEventListener('click', () => {
          qty += 1;
          qtyEl.textContent = qty;
        });

        const addBtn = document.getElementById('pd-add-to-cart');
        addBtn.addEventListener('click', () => {
          CartStore.addItem(product.id, qty);
          Vetra.updateCartBadge();
          const original = addBtn.textContent;
          addBtn.textContent = 'Added ✓';
          addBtn.classList.add('added');
          addBtn.disabled = true;
          setTimeout(() => {
            addBtn.textContent = original;
            addBtn.classList.remove('added');
            addBtn.disabled = false;
          }, 1200);
        });

        // ---- Reviews (same pattern as store.html, scoped to this product) ----
        const reviews = (product.reviews || []).slice();

        function renderReviewSummary() {
          const summaryEl = document.getElementById('review-summary');
          if (!reviews.length) {
            summaryEl.innerHTML = `<p style="margin:0; font-size:13px; color:var(--muted);">No reviews yet — be the first to review this product.</p>`;
            return;
          }
          const avg = reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length;
          const fullStars = Math.round(avg);
          summaryEl.innerHTML = `
            <span class="review-summary-score">${avg.toFixed(1)}</span>
            <div>
              <div class="review-summary-stars">${'★'.repeat(fullStars)}${'☆'.repeat(5 - fullStars)}</div>
              <p class="review-summary-meta">${reviews.length} review${reviews.length === 1 ? '' : 's'} &middot; verified orders only</p>
            </div>
          `;
        }

        function renderReviewList() {
          const listEl = document.getElementById('reviewList');
          listEl.innerHTML = reviews.map((r) => `
            <div class="review-card">
              <div class="review-card-head">
                <span class="review-card-name">${r.name}</span>
                <span class="review-card-date">${r.date}</span>
              </div>
              <div class="review-card-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
              <p class="review-card-text">${r.text}</p>
              <span class="verified-tag" style="margin-top:8px; display:inline-block;">Verified purchase</span>
            </div>
          `).join('');
        }

        renderReviewSummary();
        renderReviewList();

        // Real purchase gate: only a buyer who has actually checked out
        // with this product id (see assets/purchase-history.js, written by
        // cart.js's checkout handler) gets the review form at all — everyone
        // else sees the hint text only, no way to submit.
        const reviewForm = document.getElementById('review-form');
        const reviewFormHint = document.getElementById('review-form-hint');
        const hasPurchasedThis =
          typeof PurchaseHistory !== 'undefined' && PurchaseHistory.hasPurchased(product.id);
        if (hasPurchasedThis) {
          reviewForm.hidden = false;
          reviewFormHint.textContent = "You've purchased this product — share how it went.";
        } else {
          reviewForm.hidden = true;
          reviewFormHint.textContent = 'You can only review a product after a completed order for it.';
        }

        const starInput = document.getElementById('star-input');
        const starButtons = Array.from(starInput.querySelectorAll('.star-btn'));

        function setStars(value) {
          starInput.dataset.value = String(value);
          starButtons.forEach((btn) => {
            btn.classList.toggle('active', Number(btn.dataset.star) <= value);
          });
        }

        starButtons.forEach((btn) => {
          btn.addEventListener('click', () => setStars(Number(btn.dataset.star)));
        });

        document.getElementById('review-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const rating = Number(starInput.dataset.value);
          const textEl = document.getElementById('review-text');
          const text = textEl.value.trim();

          if (!rating) {
            CustomerUI.info({ title: 'Rating required', bodyHtml: 'Please select a star rating before submitting.' });
            return;
          }
          if (!text) {
            textEl.focus();
            return;
          }

          reviews.unshift({
            name: 'You',
            rating,
            date: new Date().toISOString().slice(0, 10),
            text,
          });
          renderReviewSummary();
          renderReviewList();

          setStars(0);
          textEl.value = '';
        });
      });
    </script>
