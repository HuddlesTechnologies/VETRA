        <section class="page-shell">
          <button type="button" class="store-back-btn" id="product-back-btn" aria-label="Go back">

          <div id="product-detail-content">

                <div class="product-detail-image">
                  <img id="pd-image" src="" alt="" />
                  <video id="pd-video" hidden controls playsinline></video>
                </div>
                <div class="product-detail-thumbs" id="pd-thumbs" hidden></div>
              </div>
              <div class="product-detail-info">
                <p class="page-kicker" id="pd-category">—</p>
                <h1 id="pd-name">—</h1>
                <p class="product-detail-price" id="pd-price">—</p>
                <p class="product-detail-loc" id="pd-location" hidden></p>
                <a class="product-detail-vendor" id="pd-vendor-link" href="#" hidden>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1.5-5h15L21 9"></path><path d="M4 9v10a1 1 0 0 0 1 1h4v-6h6v6h4a1 1 0 0 0 1-1V9"></path></svg>
                  Sold by <span id="pd-vendor-name"></span>
                  <span id="pd-vendor-verified" hidden></span>
                </a>

                <p class="product-detail-desc" id="pd-description"></p>
                <p class="product-detail-specs" id="pd-specs" hidden></p>
                <div class="product-detail-keywords" id="pd-keywords" hidden></div>

                <div class="product-detail-actions">
                  <div class="cart-item-actions">
                    <button class="qty-btn" type="button" id="pd-qty-decrement">−</button>
                    <span id="pd-qty">1</span>
                    <button class="qty-btn" type="button" id="pd-qty-increment">+</button>
                  </div>
                  <p class="qty-stock-hint" id="pd-qty-stock-hint" hidden></p>
                  <!-- Deliberately not class="add-cart" — that class is what
                       assets/interactions.js's global delegated handler
                       matches, which expects a `[data-product-id]` ancestor
                       card and falls back to navigating to cart.html when
                       there isn't one. This button already has its own
                       handler below (it knows its product from the page's
                       own ?id= query param, not a card), so reusing that
                       class here double-fired both handlers and the global
                       one's fallback nav.href'd the page away entirely. -->
                  <button class="primary-btn" type="button" id="pd-add-to-cart">Add to Cart</button>
                </div>
              </div>
            </div>

            <!-- Reviews — the backend only has vendor-level reviews (no
                 per-product review table), so this shows the product's
                 vendor's real reviews via GET /api/vendors/:id/reviews,
                 same as store.html. The "write a review" form is gated on
                 a real completed-order check against that vendor. -->

                      <button type="button" class="star-btn" data-star="2" aria-label="2 stars">★</button>
                      <button type="button" class="star-btn" data-star="3" aria-label="3 stars">★</button>
                      <button type="button" class="star-btn" data-star="4" aria-label="4 stars">★</button>

    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        let product = null;
        try {
          if (id) product = await VetraCatalog.loadOne(id);
        } catch (err) {
          product = null;
        }

        if (!product) {
          document.getElementById('product-not-found').hidden = false;
          document.getElementById('product-detail-content').hidden = true;
          return;
        }

        document.title = `VETRA · ${product.name}`;

        // ---- Media gallery (images + video) ----
        // Previously only images[0] was ever rendered, so a vendor's other
        // photos and any uploaded video (product.video_url) were invisible
        // to buyers. Build a single ordered media list — video last, since
        // the primary listing photo is the more useful first impression —
        // and let thumbnails switch the main viewer between them.
        const images = Array.isArray(product.images) ? product.images : [];
        const media = images.map((url) => ({ type: 'image', url }));
        if (product.video_url) media.push({ type: 'video', url: product.video_url });

        const pdImage = document.getElementById('pd-image');
        const pdVideo = document.getElementById('pd-video');
        const pdThumbs = document.getElementById('pd-thumbs');

        function showMedia(index) {
          const item = media[index] || { type: 'image', url: 'assets/images/product-placeholder.jpg' };
          if (item.type === 'video') {
            pdVideo.src = item.url;
            pdVideo.hidden = false;
            pdImage.hidden = true;
            pdImage.removeAttribute('src');
          } else {
            pdVideo.pause();
            pdVideo.hidden = true;
            pdVideo.removeAttribute('src');
            pdImage.hidden = false;
            pdImage.src = item.url;
          }
          pdImage.alt = product.name;
          Array.from(pdThumbs.children).forEach((thumb, i) => {
            thumb.classList.toggle('active', i === index);
          });
        }

        if (media.length > 1) {
          pdThumbs.innerHTML = media.map((item, i) => `
            <button type="button" class="product-detail-thumb" data-index="${i}" aria-label="${item.type === 'video' ? 'Show video' : `Show image ${i + 1}`}">
              <img src="${item.type === 'video' ? (images[0] || 'assets/images/product-placeholder.jpg') : item.url}" alt="" />
              ${item.type === 'video' ? '<span class="product-detail-thumb-video-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></span>' : ''}
            </button>
          `).join('');
          pdThumbs.hidden = false;
          Array.from(pdThumbs.children).forEach((thumb) => {
            thumb.addEventListener('click', () => showMedia(Number(thumb.dataset.index)));
          });
        }

        showMedia(0);

        document.getElementById('pd-category').textContent = product.category || 'Product';
        document.getElementById('pd-name').textContent = product.name;
        document.getElementById('pd-price').textContent = formatNaira(product.price);
        document.getElementById('pd-description').textContent = product.description || '';

        // Color/storage — vendor-supplied free text (backend/migrations/
        // 002_feature_updates.sql), so only render the line when at
        // least one is actually set rather than showing "Color: — ·
        // Storage: —" on every non-device listing.
        const specParts = [];
        if (product.color) specParts.push(`Color: ${product.color}`);
        if (product.storage) specParts.push(`Storage: ${product.storage}`);
        const specsEl = document.getElementById('pd-specs');
        if (specParts.length) {
          specsEl.textContent = specParts.join(' · ');
          specsEl.hidden = false;
        }

        // Search keywords — shown here as plain chips so a buyer who
        // lands on the listing (rather than searching for the term
        // directly) can still see what it's tagged with.
        const keywords = Array.isArray(product.keywords) ? product.keywords : [];
        const keywordsEl = document.getElementById('pd-keywords');
        if (keywords.length) {
          keywordsEl.innerHTML = keywords
            .map((k) => `<span class="product-detail-keyword-chip">${String(k).replace(/</g, '&lt;')}</span>`)
            .join('');
          keywordsEl.hidden = false;
        }

        // No per-product location in the database (that was decorative mock
        // data) — #pd-location just stays hidden, same as its default state.

        const vendorLink = document.getElementById('pd-vendor-link');
        if (product.vendor_id && product.vendor_name) {
          vendorLink.hidden = false;
          vendorLink.href = `store.html?vendor=${product.vendor_id}`;
          document.getElementById('pd-vendor-name').textContent = product.vendor_name;
          // Real KYC outcome (product.vendor_kyc_verified, joined server-side
          // in backend/src/routes/products.routes.js) — same source store.html's
          // storefront badge uses, not an assumption every seller is verified.
          document.getElementById('pd-vendor-verified').outerHTML = verifiedBadgeMarkup(product.vendor_kyc_verified);
        }

        document.getElementById('product-back-btn').addEventListener('click', () => {
          if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
            window.history.back();
          } else {
            window.location.href = 'explore.html';
          }
        });

        // ---- Quantity stepper + Add to Cart ----
        // Capped at stock_quantity — the same limit checkout ultimately
        // enforces server-side (POST /api/orders rejects an over-stock
        // order outright), so this just tells the buyer why the stepper
        // stopped moving instead of letting them build a cart quantity
        // that would fail at checkout anyway.
        let qty = 1;
        // null/undefined (data unavailable) falls back to no cap; a real
        // 0 must still cap immediately, not be treated as "no limit" —
        // Number(0) || 0 would otherwise collapse both cases together.
        const stockAvailable = product.stock_quantity == null ? Infinity : Number(product.stock_quantity);
        const qtyEl = document.getElementById('pd-qty');
        const stockHintEl = document.getElementById('pd-qty-stock-hint');
        const incrementBtn = document.getElementById('pd-qty-increment');

        function updateQtyUI() {
          qtyEl.textContent = qty;
          const atMax = qty >= stockAvailable;
          incrementBtn.disabled = atMax;
          if (atMax) {
            stockHintEl.textContent = `Only ${stockAvailable} in stock — that's the max you can order.`;
            stockHintEl.hidden = false;
          } else {
            stockHintEl.hidden = true;
          }
        }

        document.getElementById('pd-qty-decrement').addEventListener('click', () => {
          qty = Math.max(1, qty - 1);
          updateQtyUI();
        });
        incrementBtn.addEventListener('click', () => {
          if (qty >= stockAvailable) return;
          qty += 1;
          updateQtyUI();
        });
        updateQtyUI();

        const addBtn = document.getElementById('pd-add-to-cart');
        addBtn.addEventListener('click', () => {
          CartStore.addItem(product.id, qty);
          Vetra.updateCartBadge();
          const original = addBtn.textContent;
          addBtn.textContent = 'Added ✓';
          addBtn.classList.add('added');
          addBtn.disabled = true;
          setTimeout(() => {
            addBtn.textContent = original;
            addBtn.classList.remove('added');
            addBtn.disabled = false;
          }, 1200);
        });

        // ---- Reviews ----
        // The backend only has vendor-level reviews (see
        // backend/src/routes/reviews.routes.js) — there's no per-product
        // review table, so this shows the product's vendor's reviews
        // rather than fabricating per-product data that doesn't exist
        // server-side. Same rating/count/reviews shape store.html uses.
        let reviewsData = { average: null, count: 0, reviews: [] };
        try {
          reviewsData = await VetraAPI.request(`/vendors/${product.vendor_id}/reviews`);
        } catch (err) {
          /* leave the empty default on failure */
        }

        function renderReviewSummary() {
          const summaryEl = document.getElementById('review-summary');
          if (!reviewsData.reviews.length) {
            summaryEl.innerHTML = `<p style="margin:0; font-size:13px; color:var(--muted);">No reviews yet for this store — be the first to review it.</p>`;
            return;
          }
          const avg = reviewsData.average || 0;
          const fullStars = Math.round(avg);
          summaryEl.innerHTML = `
            <span class="review-summary-score">${avg.toFixed(1)}</span>
            <div>
              <div class="review-summary-stars">${'★'.repeat(fullStars)}${'☆'.repeat(5 - fullStars)}</div>
              <p class="review-summary-meta">${reviewsData.count} review${reviewsData.count === 1 ? '' : 's'} for this store &middot; verified orders only</p>
            </div>
          `;
        }

        function renderReviewList() {
          const listEl = document.getElementById('reviewList');
          listEl.innerHTML = reviewsData.reviews.map((r) => `
            <div class="review-card">
              <div class="review-card-head">
                <span class="review-card-name">${r.buyer_name}</span>
                <span class="review-card-date">${new Date(r.created_at).toISOString().slice(0, 10)}</span>
              </div>
              <div class="review-card-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
              <p class="review-card-text">${r.review_text}</p>
              <span class="verified-tag" style="margin-top:8px; display:inline-block;">Verified purchase</span>
            </div>
          `).join('');
        }

        renderReviewSummary();
        renderReviewList();

        // Real purchase gate: the review form only appears for a signed-in
        // buyer with at least one completed order from this product's
        // vendor (reviews are vendor-level, not per-product — see above).
        const reviewForm = document.getElementById('review-form');
        const reviewFormHint = document.getElementById('review-form-hint');
        let eligibleOrderId = null;

        if (VetraAPI.getToken('buyer')) {
          try {
            const myOrders = await VetraAPI.request('/orders/mine', { method: 'GET', role: 'buyer' });
            const eligible = myOrders.find((o) => o.vendor_id === product.vendor_id && o.status === 'completed');
            if (eligible) eligibleOrderId = eligible.id;
          } catch (err) {
            /* leave eligibleOrderId null on failure — form stays hidden */
          }
        }

        if (eligibleOrderId) {
          reviewForm.hidden = false;
          reviewFormHint.textContent = "You've ordered from this store — share how it went.";
        } else {
          reviewForm.hidden = true;
          reviewFormHint.textContent = 'You can only review a store after a completed order with them.';
        }

        const starInput = document.getElementById('star-input');
        const starButtons = Array.from(starInput.querySelectorAll('.star-btn'));

        function setStars(value) {
          starInput.dataset.value = String(value);
          starButtons.forEach((btn) => {
            btn.classList.toggle('active', Number(btn.dataset.star) <= value);
          });
        }

        starButtons.forEach((btn) => {
          btn.addEventListener('click', () => setStars(Number(btn.dataset.star)));
        });

        document.getElementById('review-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const rating = Number(starInput.dataset.value);
          const textEl = document.getElementById('review-text');
          const text = textEl.value.trim();

          if (!rating) {
            CustomerUI.info({ title: 'Rating required', bodyHtml: 'Please select a star rating before submitting.' });
            return;
          }
          if (!text) {
            textEl.focus();
            return;
          }
          if (!eligibleOrderId) return;

          const submitBtn = reviewForm.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          try {
            await VetraAPI.request(`/vendors/${product.vendor_id}/reviews`, {
              method: 'POST',
              role: 'buyer',
              body: { rating, text, orderId: eligibleOrderId },
            });
            reviewsData = await VetraAPI.request(`/vendors/${product.vendor_id}/reviews`);
            renderReviewSummary();
            renderReviewList();
            setStars(0);
            textEl.value = '';
          } catch (err) {
            CustomerUI.info({ title: "Couldn't submit review", bodyHtml: err.message });
          } finally {
            submitBtn.disabled = false;
          }
        });
      });
    </script>
