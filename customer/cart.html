        <header id="app-header">

      <div class="topbar">
        <div style="display:flex;align-items:center;">

        </div>
        <div class="icon-actions">
          <a class="icon-btn" href="notifications.html" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></a>
          <a class="icon-btn" href="cart.html" aria-label="Cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></a>
          <a class="icon-btn header-avatar" href="settings.html" aria-label="Your profile"><img src="imgs/avatar-dummy.png" alt=""></a>
        </div>
      </div>
      
    
</header>

        <section class="page-shell">
          <div class="page-header">
            <div>
              <p class="page-kicker">Your basket</p>
              <h1>Cart</h1>
            </div>
            <a class="page-link" href="dashboard.html">Continue shopping</a>
          </div>

          <!-- Real cart, rendered from CartStore (assets/cart-store.js) —
               no more static/dummy line items. Empty and non-empty states
               are two separate blocks toggled via `hidden` rather than one
               markup tree with a conditional message, so there's nothing
               fake left in the DOM for a shopper to see mid-load. -->
          <div id="cart-empty-state" hidden>
            <div class="page-card" style="text-align: center; padding: 48px 20px;">
              <p style="font-size: 14px; color: var(--muted); margin-bottom: 16px;">Your cart is empty.</p>
              <a class="primary-btn" href="explore.html" style="display: inline-block; text-decoration: none;">Start shopping</a>
            </div>
          </div>

          <div class="page-grid" id="cart-content" hidden>
            <div class="page-card large" id="cart-items-list"></div>

            <aside class="summary-card">
              <h3>Order summary</h3>
              <div class="summary-row"><span>Subtotal</span><strong id="cart-subtotal">₦0</strong></div>
              <div class="summary-row"><span>Delivery</span><strong id="cart-delivery">₦0</strong></div>
              <div class="summary-row total"><span>Total</span><strong id="cart-total">₦0</strong></div>
              <button class="primary-btn" type="button" id="cart-checkout-btn">Checkout</button>
              <button class="secondary-btn" type="button" id="cart-save-btn">Save for later</button>
            </aside>
          </div>
        </section>
      </div>
    </div>

    <!-- Shared confirm modal — see CustomerUI.confirm()/.info() in assets/ui.js.
         Replaces native confirm()/alert() popups site-wide with an in-app
         dialog matching the rest of the UI. -->
    <div class="modal-overlay" id="confirm-modal" hidden>
      <div class="modal-panel">
        <div class="modal-header">
          <h2 id="confirm-modal-title">Confirm action</h2>
          <button type="button" class="modal-close-btn" id="confirm-modal-close" aria-label="Close">✕</button>
        </div>
        <div class="modal-body">
          <p class="confirm-modal-body" id="confirm-modal-body"></p>
          <div class="form-actions">
            <button type="button" class="btn btn-cancel" id="confirm-modal-cancel">Cancel</button>
            <button type="button" class="btn btn-save" id="confirm-modal-confirm">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/purchase-history.js"></script>

    <script src="assets/interactions.js"></script>
    <script src="assets/ui.js"></script>
    <script src="assets/cart.js"></script>
