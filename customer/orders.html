    <!-- File a report modal — opened by any order's "Report an issue"
         button (assets/report-issue.js). Matches the escrow-hold flow
         described on ../buyer-protection.html: filing here keeps the
         order's escrow held pending review rather than needing a live
         chat conversation to start a case. -->
    <div class="modal-overlay" id="report-modal" hidden>
      <div class="modal-panel">
        <div class="modal-header">
          <h2>Report an issue</h2>
          <button type="button" class="modal-close-btn" id="report-modal-close" aria-label="Close">✕</button>
        </div>
        <div class="modal-body">
          <p style="font-size: 12.5px; color: var(--muted); margin: 0 0 14px;">
            Order <strong id="report-order-id">—</strong> &middot; <span id="report-vendor-name">—</span>
          </p>
          <form id="report-form">
            <div class="field-group">
              <label for="report-reason">What went wrong?</label>
              <select id="report-reason" required>
                <option value="" disabled selected>Select a reason</option>
                <option value="Item never arrived">Item never arrived</option>
                <option value="Item arrived damaged or defective">Item arrived damaged or defective</option>
                <option value="Item significantly not as described">Item significantly not as described</option>
                <option value="Unauthorized or duplicate charge">Unauthorized or duplicate charge</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field-group">
              <label for="report-details">Details</label>
              <textarea id="report-details" rows="4" placeholder="Tell us what happened — include as much detail as you can." required></textarea>
            </div>
            <p style="font-size: 11.5px; color: var(--muted); margin: 0 0 14px;">
              Your escrow payment stays held while we review — see
              <a href="../buyer-protection.html" target="_blank" rel="noopener noreferrer">Buyer Protection</a> for how this works.
            </p>
            <div class="form-actions">
              <button type="button" class="btn btn-cancel" id="report-cancel-btn">Cancel</button>
              <button type="submit" class="btn btn-save">Submit report</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Shared confirm modal — see CustomerUI.confirm()/.info() in assets/ui.js.
         Used here to prompt a guest to sign in instead of redirecting them
         away the instant they land on this page. -->
    <div class="modal-overlay" id="confirm-modal" hidden>
      <div class="modal-panel">
        <div class="modal-header">
          <h2 id="confirm-modal-title">Confirm action</h2>
          <button type="button" class="modal-close-btn" id="confirm-modal-close" aria-label="Close">✕</button>
        </div>
        <div class="modal-body">
          <p class="confirm-modal-body" id="confirm-modal-body"></p>
          <div class="form-actions">
            <button type="button" class="btn btn-cancel" id="confirm-modal-cancel">Cancel</button>
            <button type="button" class="btn btn-save" id="confirm-modal-confirm">Confirm</button>
          </div>
        </div>
      </div>
