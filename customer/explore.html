    <script>
      // Builds the picture-only banner carousel from the real
      // GET /api/site-banners — see dashboard.html's identical script for
      // the full explanation of why wireBannerCarousel() is called again
      // here.
      document.addEventListener("DOMContentLoaded", async function () {
        const DEFAULT_BANNERS = [
          { id: "default-1", imageUrl: "../assets/banners/banner-1.jpg", alt: "VETRA" },
          { id: "default-2", imageUrl: "../assets/banners/banner-2.jpg", alt: "VETRA" },
        ];

        let banners = DEFAULT_BANNERS;
        try {
          const real = await VetraAPI.request("/site-banners", { method: "GET" });
          if (real.length) banners = real;
        } catch (err) {
          /* keep the defaults on failure */
        }

        const bannerEl = document.querySelector("#app-banner .banner");
        const dotsEl = document.querySelector("#app-banner .dots");
        if (bannerEl && dotsEl) {
          bannerEl.innerHTML = banners
            .map(
              (b, i) => `
                <div class="banner-slide${i === 0 ? " active" : ""}" data-slide="${i}">
                  <img class="banner-slide-img" src="${b.imageUrl}" alt="${b.alt || ""}">
                </div>
              `
            )
            .join("");

          dotsEl.innerHTML = banners
            .map((b, i) => `<span class="${i === 0 ? "active" : ""}" data-dot="${i}"></span>`)
            .join("");

          Vetra.wireBannerCarousel();
        }
      });
    </script>

    <script>
      // Top Vendors rail — real GET /api/vendors, capped to a handful.
      // Stays hidden (its default state in the markup) rather than
      // showing an empty "TOP VENDORS" header when there are none yet.
      document.addEventListener("DOMContentLoaded", async function () {
        const rail = document.getElementById("top-vendors-rail");
        const scroll = document.getElementById("top-vendors-scroll");
        if (!rail || !scroll) return;

        let vendors = [];
        try {
          vendors = await VetraVendorDirectory.load();
        } catch (err) {
          return; // leave the rail hidden on failure
        }
        if (!vendors.length) return;

        scroll.innerHTML = vendors
          .slice(0, 8)
          .map((v) => {
            const avatar = v.avatar_url || "imgs/avatar-placeholder.svg";
            const rating = Number(v.rating || 0).toFixed(1);
            const verifiedLabel = v.kyc_verified ? "Verified" : "Not verified";
            return `
              <a href="store.html?vendor=${v.id}" class="vendor-mini-card">
                <div class="vendor-mini-avatar"><img src="${avatar}" alt="${v.store_name}"></div>
                <span class="vendor-mini-name">${v.store_name}</span>
                <span class="vendor-mini-meta">★ ${rating} · ${verifiedLabel}</span>
              </a>
            `;
          })
          .join("");
        rail.hidden = false;
      });

      document.addEventListener("DOMContentLoaded", async function () {
        const grid = document.getElementById("app-products-grid");
        try {
          const products = await VetraCatalog.load();
          renderCustomerProductGrid(products, grid, "No products yet — check back soon.");
        } catch (err) {
          if (grid) grid.innerHTML = `<p class="products-empty-state">Couldn't load products: ${err.message}</p>`;
          return;
        }

        // initProductFilters() captures the grid's cards at call time, so
        // it has to run after the real cards above exist, not before.
        const filters = initProductFilters({
          triggerSelector: "#exploreFilterBtn",
          panelId: "exploreFilterPanel",
          gridSelector: "#app-products .grid",
        });

        // Category quick-filter chips (plain pill buttons, no image grid).
        // Clicking one filters the grid below, including an honest "no
        // products yet" for a category this page has no matches for.
        document.querySelectorAll(".category-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            const name = chip.dataset.category;
            if (!name || !filters) return;
            filters.filterByCategory(name);
            document.querySelector("#app-products")?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        });

        // Lets dashboard.html's category rail (and any other link) deep-link
        // here already filtered, e.g. explore.html?cat=Electronics — this was
        // category.html's job before the two pages were merged.
        const params = new URLSearchParams(window.location.search);
        const cat = params.get("cat");
        if (cat && filters) filters.filterByCategory(cat);
      });
    </script>
