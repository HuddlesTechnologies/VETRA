    <script>
      // Builds the picture-only banner carousel from the real
      // GET /api/site-banners, see dashboard.html's identical script for
      // the full explanation of why wireBannerCarousel() is called again
      // here.
      document.addEventListener("DOMContentLoaded", async function () {
        const DEFAULT_BANNERS = [
          { id: "default-1", imageUrl: "../assets/banners/banner-1.jpg", alt: "VETRA" },
          { id: "default-2", imageUrl: "../assets/banners/banner-2.jpg", alt: "VETRA" },
        ];

        let banners = DEFAULT_BANNERS;
        try {
          const real = await VetraAPI.request("/site-banners", { method: "GET" });
          if (real.length) banners = real;
        } catch (err) {
          /* keep the defaults on failure */
        }

        const bannerEl = document.querySelector("#app-banner .banner");
        const dotsEl = document.querySelector("#app-banner .dots");
        if (bannerEl && dotsEl) {
          bannerEl.innerHTML = banners
            .map(
              (b, i) => `
                <div class="banner-slide${i === 0 ? " active" : ""}" data-slide="${i}">
                  <img class="banner-slide-img" src="${b.imageUrl}" alt="${VetraAPI.escapeHtml(b.alt || "")}">
                </div>
              `
            )
            .join("");

          dotsEl.innerHTML = banners
            .map((b, i) => `<span class="${i === 0 ? "active" : ""}" data-dot="${i}"></span>`)
            .join("");

          Vetra.wireBannerCarousel();
        }
      });
    </script>

    <script>
      // Top Vendors rail, real GET /api/vendors, capped to a handful.
      // Stays hidden (its default state in the markup) rather than
      // showing an empty "TOP VENDORS" header when there are none yet.
      document.addEventListener("DOMContentLoaded", async function () {
        const rail = document.getElementById("top-vendors-rail");
        const scroll = document.getElementById("top-vendors-scroll");
        if (!rail || !scroll) return;

        let vendors = [];
        try {
          vendors = await VetraVendorDirectory.load();
        } catch (err) {
          return; // leave the rail hidden on failure
        }
        // "Top Vendors" means verified vendors only, a store with no
        // real KYC review behind it shouldn't be surfaced as a
        // highlighted pick alongside ones that are.
        const verifiedVendors = vendors.filter((v) => v.kyc_verified);
        if (!verifiedVendors.length) return;

        scroll.innerHTML = verifiedVendors
          .slice(0, 8)
          .map((v) => {
            const avatar = v.avatar_url || "../assets/avatar-placeholder.svg";
            const rating = Number(v.rating || 0).toFixed(1);
            const storeName = VetraAPI.escapeHtml(v.store_name || "");
            return `
              <a href="store.html?vendor=${v.id}" class="vendor-mini-card">
                <div class="vendor-mini-avatar"><img src="${avatar}" alt="${storeName}"></div>
                <span class="vendor-mini-name"><span class="vendor-mini-name-text">${storeName}</span>${verifiedBadgeMarkup(v.kyc_verified)}</span>
                <span class="vendor-mini-meta">★ ${rating}</span>
              </a>
            `;
          })
          .join("");
        rail.hidden = false;
      });

      document.addEventListener("DOMContentLoaded", async function () {
        const grid = document.getElementById("app-products-grid");
        const searchInput = document.getElementById("exploreSearchInput");
        const searchBtn = document.getElementById("exploreSearchBtn");
        const params = new URLSearchParams(window.location.search);
        const initialQuery = (params.get("q") || "").trim();
        if (searchInput && initialQuery) searchInput.value = initialQuery;

        try {
          const products = await VetraCatalog.load(initialQuery ? { q: initialQuery } : {});
          renderCustomerProductGrid(
            products,
            grid,
            initialQuery ? `No products match “${VetraAPI.escapeHtml(initialQuery)}”.` : "No products yet, check back soon."
          );
        } catch (err) {
          if (grid) grid.innerHTML = `<p class="products-empty-state">Couldn't load products: ${VetraAPI.escapeHtml(err.message)}</p>`;
          return;
        }

        // initProductFilters() captures the grid's cards at call time, so
        // it has to run after the real cards above exist, not before.
        const filters = initProductFilters({
          triggerSelector: "#exploreFilterBtn",
          panelId: "exploreFilterPanel",
          gridSelector: "#app-products .grid",
        });

        // Category quick-filter chips (plain pill buttons, no image grid).
        // Clicking one filters the grid below, including an honest "no
        // products yet" for a category this page has no matches for.
        document.querySelectorAll(".category-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            const name = chip.dataset.category;
            if (!name || !filters) return;
            // Clicking the selected category again clears it.
            if (chip.classList.contains("active")) {
              chip.classList.remove("active");
              document.querySelectorAll("[data-filter-category]").forEach((cb) => (cb.checked = false));
              filters.applyFilters();
              return;
            }
            document.querySelectorAll(".category-chip.active").forEach((c) => c.classList.remove("active"));
            chip.classList.add("active");
            filters.filterByCategory(name);
            document.querySelector("#app-products")?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        });

        // Keep the chip row in step with the filter panel's checkboxes.
        function syncCategoryChips() {
          const checked = Array.from(document.querySelectorAll("[data-filter-category]:checked")).map((cb) => cb.value);
          document.querySelectorAll(".category-chip").forEach((c) => {
            c.classList.toggle("active", checked.length === 1 && checked[0] === c.dataset.category);
          });
        }
        document.querySelectorAll("[data-filter-category]").forEach((cb) => cb.addEventListener("change", syncCategoryChips));
        document.querySelector("[data-filter-clear]")?.addEventListener("click", syncCategoryChips);

        // Lets dashboard.html's category rail (and any other link) deep-link
        // here already filtered, e.g. explore.html?cat=Electronics, this was
        // category.html's job before the two pages were merged.
        const cat = params.get("cat");
        if (cat && filters) {
          filters.filterByCategory(cat);
          document.querySelector(`.category-chip[data-category="${CSS.escape(cat)}"]`)?.classList.add("active");
        }

        // Product search. Queries the server (GET /api/products?q=, which
        // matches name, description and vendor keywords) rather than only
        // the cards already on the page, then re-renders the grid and lets
        // the filter panel re-apply its category/price/sort on top.
        // Debounced while typing; Enter or the search icon runs it now.
        // The query is mirrored into ?q= so a refresh or shared link keeps it.
        let lastQuery = initialQuery;
        let searchSeq = 0;
        let debounce;
        async function runSearch() {
          clearTimeout(debounce);
          const q = searchInput.value.trim();
          if (q === lastQuery) return;
          lastQuery = q;
          const seq = ++searchSeq;
          const url = new URL(window.location.href);
          if (q) url.searchParams.set("q", q); else url.searchParams.delete("q");
          history.replaceState(null, "", url);
          grid.setAttribute("aria-busy", "true");
          grid.classList.add("is-searching");
          try {
            const products = await VetraCatalog.load(q ? { q } : {});
            if (seq !== searchSeq) return; // a newer search already started
            renderCustomerProductGrid(
              products,
              grid,
              q ? `No products match “${VetraAPI.escapeHtml(q)}”. Try a shorter or different word.` : "No products yet, check back soon."
            );
            if (filters) filters.refresh();
          } catch (err) {
            if (seq !== searchSeq) return;
            lastQuery = null; // let the same query be retried
            grid.innerHTML = `<p class="products-empty-state">Search failed: ${VetraAPI.escapeHtml(err.message)}</p>`;
          } finally {
            if (seq === searchSeq) {
              grid.removeAttribute("aria-busy");
              grid.classList.remove("is-searching");
            }
          }
        }
        if (searchInput) {
          searchInput.addEventListener("input", () => {
            clearTimeout(debounce);
            debounce = setTimeout(runSearch, 350);
          });
          searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              runSearch();
              searchInput.blur();
              document.querySelector("#app-products")?.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        }
        document.querySelectorAll(".search-chip").forEach((chip) => {
          chip.addEventListener("click", (e) => {
            if (!searchInput) return;
            e.preventDefault();
            searchInput.value = chip.dataset.query;
            runSearch();
            document.querySelector("#app-products")?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        });
        if (searchBtn) searchBtn.addEventListener("click", () => {
          if (searchInput.value.trim()) runSearch(); else searchInput.focus();
        });
      });
    </script>
