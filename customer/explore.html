<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VETRA Explore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="app-sidebar"></aside>
      <button class="sidebar-reopen" id="app-sidebar-reopen" aria-label="Open sidebar">☰</button>

      <div class="phone">
        <header id="app-header"></header>

        <section class="banner-wrap" id="app-banner"></section>
        <section class="categories" id="app-categories"></section>
        <section class="products-wrap" id="app-products"></section>
      </div>
    </div>

    <div id="app-bottomnav" class="bottom-nav"></div>

    <script src="assets/layout.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        Vetra.renderHeader("#app-header", { showSearch: true });
        Vetra.renderBanner(
          [
            {
              image: "assets/images/banner-3.jpg",
              eyebrow: "Explore",
              headline: "Discover top picks",
              headlineAccent: "for your next buy",
              sub: "Browse trending products and curated categories across VETRA.",
            },
            {
              image: "assets/images/banner-4.jpg",
              eyebrow: "Featured sellers",
              headline: "Shop reliable listings",
              headlineAccent: "from trusted vendors",
              sub: "Find deals selected for quality, price, and fast delivery.",
            },
          ],
          "#app-banner"
        );

        Vetra.renderCategories(
          [
            { image: "assets/images/cat-electronics.jpg", label: "Electronics" },
            { image: "assets/images/cat-fashion.jpg", label: "Fashion" },
            { image: "assets/images/cat-home.jpg", label: "Home & Office" },
            { image: "assets/images/cat-health.jpg", label: "Health & Beauty" },
            { image: "assets/images/cat-sports.jpg", label: "Sports" },
            { image: "assets/images/cat-supermarket.jpg", label: "Supermarket" },
          ],
          "#app-categories"
        );

        Vetra.renderProducts(
          [
            {
              image: "assets/images/product-1.jpg",
              name: "Oraimo Power Bank 25000mAh",
              price: "₦17,489",
              location: "Asokoro, Abuja",
            },
            {
              image: "assets/images/product-2.jpg",
              name: "Smart LED TV 43\"",
              price: "₦174,500",
              location: "Ikeja, Lagos",
            },
            {
              image: "assets/images/product-3.jpg",
              name: "Noise Cancelling Headphones",
              price: "₦28,900",
              location: "Victoria Island, Lagos",
            },
            {
              image: "assets/images/product-4.jpg",
              name: "Air Fryer XL",
              price: "₦42,300",
              location: "Gwarinpa, Abuja",
            },
            {
              image: "assets/images/product-5.jpg",
              name: "Gaming Laptop",
              price: "₦285,000",
              location: "Lekki, Lagos",
            },
            {
              image: "assets/images/product-6.jpg",
              name: "Fitness Tracker Band",
              price: "₦9,700",
              location: "Yaba, Lagos",
            },
          ],
          "#app-products"
        );

        Vetra.renderSidebar("explore");
        Vetra.renderBottomNav("explore");
      });
    </script>

    <!-- Smartsupp Live Chat script -->
    <script type="text/javascript">
      var _smartsupp = _smartsupp || {};
      _smartsupp.key = '8e506cb656de83adfc99392212c488a3a63360dc';
      window.smartsupp || (function (d) {
        var s, c, o = (smartsupp = function () {
          o._.push(arguments);
        });
        o._ = [];
        s = d.getElementsByTagName('script')[0];
        c = d.createElement('script');
        c.type = 'text/javascript';
        c.charset = 'utf-8';
        c.async = true;
        c.src = 'https://www.smartsuppchat.com/loader.js?';
        s.parentNode.insertBefore(c, s);
      })(document);
    </script>
  </body>
</html>
