<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=explore.html" />
    <title>VETRA Categories</title>
    <!--
      category.html used to be its own page (a category-tile grid + product
      grid, nearly identical to explore.html's own filter/grid setup). It was
      merged into explore.html so there's one browse page instead of two
      near-duplicates, explore.html now carries the "shop by category" tile
      grid too. This file stays only as a redirect so old links/bookmarks to
      category.html (and category.html?cat=X deep links) still land
      somewhere correct, forwarding the query string along unchanged.
    -->
    <script>
      window.location.replace("explore.html" + window.location.search);
    </script>
    <link rel="stylesheet" href="../vetra-tokens.css" />
    <script src="../theme.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <p>Redirecting to <a href="explore.html">Explore</a>…</p>
  </body>
</html>
