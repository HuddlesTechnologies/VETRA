                    <button type="button" class="star-btn" data-star="3" aria-label="3 stars">★</button>

                </div>
                <div class="field-group">

                  <!-- No `required` here on purpose: the submit handler already
                       checks rating-then-text itself (see the inline script below).
                       Native required validation would intercept the submit event
                       before that JS ever runs when both are empty, which meant a
                       user got a generic browser tooltip instead of the intended
                       "select a star rating" message — see DOCUMENTATION.md. -->
                  <textarea id="review-text" rows="3" placeholder="Share how your order went..."></textarea>
                </div>

    <script>
      // ---------------------------------------------------------------
      // VETRA — VENDOR STOREFRONT PAGE (store.html?vendor=<id>)
      // Renders one vendor's public storefront from the shared mock
      // directory in assets/vendors.js (VENDORS/getAllVendors()) —
      // there's no backend, so that file is the full "database" both
      // this page and vendors.html read from. The vendor id comes from
      // the ?vendor= query param (e.g. store.html?vendor=daniel-ice-fish,
      // linked from vendors.html's directory cards and explore.html's
      // Top Vendors rail); an unknown or missing id falls back to the
      // first vendor so the page never renders empty.
      // ---------------------------------------------------------------

      const verifiedBadgeIcon = `<svg class="verified-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"></circle><path d="m8 12.5 2.5 2.5L16 9.5"></path></svg>`;

      document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const vendorId = params.get('vendor');
        const vendorKey = VENDORS[vendorId] ? vendorId : 'gods-favour';
        const vendor = VENDORS[vendorKey];

        document.title = `VETRA — ${vendor.name}`;
        document.getElementById('store-avatar').src = vendor.avatar;
        document.getElementById('store-avatar').alt = vendor.name;
        document.getElementById('store-name').textContent = vendor.name;
        document.getElementById('store-bio').textContent = vendor.bio;
        document.getElementById('store-rating').textContent = `★ ${vendor.rating}`;
        document.getElementById('store-orders').textContent = vendor.orders;
        document.getElementById('store-response-time').textContent = vendor.responseTime;
        document.getElementById('store-location').textContent = vendor.location;
        document.getElementById('store-member-since').textContent = vendor.memberSince;

        const cover = document.getElementById('store-cover');
        cover.style.backgroundImage = vendor.cover
          ? `url('${vendor.cover}')`
          : vendor.coverGradient;

        const categoryTag = document.getElementById('store-category');
        categoryTag.textContent = vendor.category;
        categoryTag.classList.toggle('pending', vendor.status === 'pending');

        document.getElementById('store-verified-badge').innerHTML =
          vendor.status === 'verified' ? verifiedBadgeIcon : '';

        document.getElementById('store-back-btn').addEventListener('click', () => {
          // Came from within the app (e.g. explore.html) -> go back there;
          // opened directly (no history) -> fall back to explore.html.
          if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
            window.history.back();
          } else {
            window.location.href = 'explore.html';
          }
        });

        const productsHeading = document.getElementById('store-products-heading');
        const productsGrid = document.getElementById('storeProductsGrid');
        const products = vendor.products || [];
        productsHeading.textContent = `FOR SALE (${products.length})`;
        productsGrid.innerHTML = products.map((p) => `
          <div class="product-card" data-product-id="${p.id}">
            <div class="product-thumb"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>
            <h4>${p.name}</h4>
            <p class="price">${p.price}</p>
            <button class="add-btn" type="button">Add to cart</button>
          </div>
        `).join('');
        // Real "New"/"Hot" badges — see assets/badges.js. Called here
        // (not on DOMContentLoaded) since this grid is built by JS above,
        // not static HTML.
        decorateProductBadges(productsGrid);

        // ---- Reviews: render existing (mocked) reviews + wire the
        // "write a review" form to append a new one in-memory. There's
        // no backend, so this can't actually verify a completed order —
        // every submitted review here is marked "Verified purchase" to
        // simulate what a real completed-order check would produce. ----
        const reviews = (vendor.reviews || []).slice();

        function renderReviewSummary() {
          const summaryEl = document.getElementById('review-summary');
          if (!reviews.length) {
            summaryEl.innerHTML = `<p style="margin:0; font-size:13px; color:var(--muted);">No reviews yet — be the first to review this store.</p>`;
            return;
          }
          const avg = reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length;
          const fullStars = Math.round(avg);
          summaryEl.innerHTML = `
            <span class="review-summary-score">${avg.toFixed(1)}</span>
            <div>
              <div class="review-summary-stars">${'★'.repeat(fullStars)}${'☆'.repeat(5 - fullStars)}</div>
              <p class="review-summary-meta">${reviews.length} review${reviews.length === 1 ? '' : 's'} &middot; verified orders only</p>
            </div>
          `;
        }

        function renderReviewList() {
          const listEl = document.getElementById('reviewList');
          listEl.innerHTML = reviews.map((r) => `
            <div class="review-card">
              <div class="review-card-head">
                <span class="review-card-name">${r.name}</span>
                <span class="review-card-date">${r.date}</span>
              </div>
              <div class="review-card-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
              <p class="review-card-text">${r.text}</p>
              <span class="verified-tag" style="margin-top:8px; display:inline-block;">Verified purchase</span>
            </div>
          `).join('');
        }

        renderReviewSummary();
        renderReviewList();

        // Real purchase gate: only a buyer who has actually checked out
        // with a product from this vendor (see assets/purchase-history.js,
        // written by cart.js's checkout handler) gets the review form —
        // everyone else sees the hint text only, no way to submit.
        const reviewForm = document.getElementById('review-form');
        const reviewFormHint = document.getElementById('review-form-hint');
        const hasPurchasedFromThisVendor =
          typeof PurchaseHistory !== 'undefined' && PurchaseHistory.hasPurchasedFromVendor(vendorKey);
        if (hasPurchasedFromThisVendor) {
          reviewForm.hidden = false;
          reviewFormHint.textContent = "You've ordered from this vendor — share how it went.";
        } else {
          reviewForm.hidden = true;
          reviewFormHint.textContent = 'You can only review a vendor after a completed order with them.';
        }

        const starInput = document.getElementById('star-input');
        const starButtons = Array.from(starInput.querySelectorAll('.star-btn'));

        function setStars(value) {
          starInput.dataset.value = String(value);
          starButtons.forEach((btn) => {
            btn.classList.toggle('active', Number(btn.dataset.star) <= value);
          });
        }

        starButtons.forEach((btn) => {
          btn.addEventListener('click', () => setStars(Number(btn.dataset.star)));
        });

        document.getElementById('review-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const rating = Number(starInput.dataset.value);
          const textEl = document.getElementById('review-text');
          const text = textEl.value.trim();

          if (!rating) {
            CustomerUI.info({ title: 'Rating required', bodyHtml: 'Please select a star rating before submitting.' });
            return;
          }
          if (!text) {
            textEl.focus();
            return;
          }

          reviews.unshift({
            name: 'You',
            rating,
            date: new Date().toISOString().slice(0, 10),
            text,
          });
          renderReviewSummary();
          renderReviewList();

          setStars(0);
          textEl.value = '';
        });
      });
    </script>
