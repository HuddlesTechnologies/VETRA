    <script>
      const VENDORS = {
        'gods-favour': {
          name: 'Godsfavour Laptops',
          avatar: 'imgs/vendor-1.jpg',
          cover: 'assets/images/cat-computing.jpg',
          category: 'Electronics & Laptops',
          status: 'verified',
          rating: '4.8',
          orders: '312',
          responseTime: '~10 min',
          location: 'Computer Village, Ikeja, Lagos',
          memberSince: 'Mar 2023',
          bio: 'Trusted reseller of new and UK-used laptops, with a warranty on every unit and same-week delivery across Lagos.',
          products: [
            { name: 'Gaming Laptop', price: '₦285,000', image: 'assets/images/product-5.jpg' },
            { name: 'Wireless Mouse', price: '₦11,300', image: 'assets/images/store/mouse.jpg' },
            { name: 'Laptop Backpack', price: '₦18,500', image: 'assets/images/store/laptop-bag.jpg' }
          ]
        },
        'daniel-ice-fish': {
          name: 'Daniel Ice Fish',
          avatar: 'imgs/vendor-2.jpg',
          cover: null,
          coverGradient: 'linear-gradient(135deg, #f59e0b, #ef4444)',
          category: 'Fresh & Frozen Seafood',
          status: 'verified',
          rating: '4.6',
          orders: '540',
          responseTime: '~30 min',
          location: 'Mile 12 Market, Lagos',
          memberSince: 'Jan 2022',
          bio: 'Daily fresh catch and frozen seafood, sourced every morning and delivered same-day across the city.',
          products: [
            { name: 'Fresh Catfish (kg)', price: '₦4,200', image: 'assets/images/store/catfish.jpg' },
            { name: 'Jumbo Prawns (kg)', price: '₦8,900', image: 'assets/images/store/prawns.jpg' },
            { name: 'Dried Crayfish (kg)', price: '₦6,500', image: 'assets/images/store/crayfish.jpg' }
          ]
        },
        'jennet-jeans': {
          name: 'Jennet Jeans',
          avatar: 'imgs/vendor-3.jpg',
          cover: 'assets/images/cat-fashion.jpg',
          category: 'Fashion & Denim',
          status: 'pending',
          rating: '4.5',
          orders: '87',
          responseTime: '~1 hr',
          location: 'Balogun Market, Lagos Island',
          memberSince: 'Aug 2024',
          bio: 'Quality denim and casual wear at wholesale-friendly prices, with new stock arriving every week.',
          products: [
            { name: 'Denim Jacket', price: '₦14,500', image: 'assets/images/store/denim-jacket.jpg' },
            { name: 'Classic Jeans', price: '₦9,800', image: 'assets/images/store/jeans.jpg' },
            { name: 'Denim Skirt', price: '₦7,200', image: 'assets/images/store/denim-skirt.jpg' }
          ]
        },
        'me-n-u-chops': {
          name: 'Me n U Chops',
          avatar: 'imgs/vendor-4.jpg',
          cover: null,
          coverGradient: 'linear-gradient(135deg, #10b981, #3f5fe0)',
          category: 'Local Food & Grills',
          status: 'pending',
          rating: '4.9',
          orders: '203',
          responseTime: '~15 min',
          location: 'Yaba, Lagos',
          memberSince: 'Jun 2024',
          bio: 'Home-style Nigerian meals and grills, made fresh to order for pickup or delivery.',
          products: [
            { name: 'Suya Skewers', price: '₦1,500', image: 'imgs/vendor-4.jpg' },
            { name: 'Jollof Rice & Chicken', price: '₦2,800', image: 'assets/images/store/jollof-rice.jpg' },
            { name: 'Grilled Chicken Plate', price: '₦3,500', image: 'assets/images/store/grilled-chicken.jpg' }
          ]
        }
      };

      const verifiedBadgeIcon = `<svg class="verified-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"></circle><path d="m8 12.5 2.5 2.5L16 9.5"></path></svg>`;

      document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const vendorId = params.get('vendor');
        const vendor = VENDORS[vendorId] || VENDORS['gods-favour'];

        document.title = `VETRA — ${vendor.name}`;
        document.getElementById('store-avatar').src = vendor.avatar;
        document.getElementById('store-avatar').alt = vendor.name;
        document.getElementById('store-name').textContent = vendor.name;
        document.getElementById('store-bio').textContent = vendor.bio;
        document.getElementById('store-rating').textContent = `★ ${vendor.rating}`;
        document.getElementById('store-orders').textContent = vendor.orders;
        document.getElementById('store-response-time').textContent = vendor.responseTime;
        document.getElementById('store-location').textContent = vendor.location;
        document.getElementById('store-member-since').textContent = vendor.memberSince;

        const cover = document.getElementById('store-cover');
        cover.style.backgroundImage = vendor.cover
          ? `url('${vendor.cover}')`
          : vendor.coverGradient;

        const categoryTag = document.getElementById('store-category');
        categoryTag.textContent = vendor.category;
        categoryTag.classList.toggle('pending', vendor.status === 'pending');

        document.getElementById('store-verified-badge').innerHTML =
          vendor.status === 'verified' ? verifiedBadgeIcon : '';

        const vendorKey = VENDORS[vendorId] ? vendorId : 'gods-favour';
        document.getElementById('store-message-link').href = `chat.html?chat=${vendorKey}`;

        document.getElementById('store-call-btn').addEventListener('click', () => {
          // TODO: replace with a real call flow.
          alert(`Calling ${vendor.name} — hook this up to your call flow.`);
        });

        document.getElementById('store-back-btn').addEventListener('click', () => {
          // Came from within the app (e.g. explore.html) -> go back there;
          // opened directly (no history) -> fall back to explore.html.
          if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
            window.history.back();
          } else {
            window.location.href = 'explore.html';
          }
        });

        const productsHeading = document.getElementById('store-products-heading');
        const productsGrid = document.getElementById('storeProductsGrid');
        const products = vendor.products || [];
        productsHeading.textContent = `FOR SALE (${products.length})`;
        productsGrid.innerHTML = products.map((p) => `
          <div class="product-card">
            <div class="product-thumb"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>
            <h4>${p.name}</h4>
            <p class="price">${p.price}</p>
            <button class="add-btn" type="button">Add to cart</button>
          </div>
        `).join('');
      });
    </script>
