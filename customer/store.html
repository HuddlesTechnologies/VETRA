    <script>
      // ---------------------------------------------------------------
      // VETRA: Vendor storefront page (store.html?vendor=<id>).
      // Renders one vendor's real storefront from GET /api/vendors/:id
      // (assets/vendors.js) plus their real active products from
      // GET /api/products?vendor=<id> (assets/products.js). The vendor
      // id comes from the ?vendor= query param, a missing/unknown/
      // unapproved id shows an honest "not found" state instead of
      // silently falling back to some other vendor.
      // ---------------------------------------------------------------

      function goBack() {
        if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
          window.history.back();
        } else {
          window.location.href = 'explore.html';
        }
      }

      document.addEventListener('DOMContentLoaded', async function () {
        document.getElementById('store-back-btn').addEventListener('click', goBack);

        const params = new URLSearchParams(window.location.search);
        const vendorId = params.get('vendor');
        let vendor;
        try {
          if (!vendorId) throw new Error('No vendor specified.');
          vendor = await VetraVendorDirectory.loadOne(vendorId);
        } catch (err) {
          document.getElementById('store-name').textContent = 'Store not found';
          document.getElementById('store-bio').textContent = "This store doesn't exist or isn't approved yet.";
          return;
        }

        document.title = `VETRA · ${vendor.store_name}`;
        document.getElementById('store-avatar').src = vendor.avatar_url || 'imgs/avatar-placeholder.svg';
        document.getElementById('store-avatar').alt = vendor.store_name;
        document.getElementById('store-name').textContent = vendor.store_name;
        document.getElementById('store-bio').textContent = vendor.store_description || 'No store description yet.';
        document.getElementById('store-rating').textContent = `★ ${Number(vendor.rating || 0).toFixed(1)}`;
        document.getElementById('store-orders').textContent = vendor.orders_count;
        document.getElementById('store-response-time').textContent = '—'; // not tracked yet
        document.getElementById('store-location').textContent = vendor.address || 'Abuja';
        document.getElementById('store-member-since').textContent = vendor.member_since
          ? formatDateNG(vendor.member_since, { month: 'short', year: 'numeric' })
          : '—';

        const cover = document.getElementById('store-cover');
        cover.style.backgroundImage = vendor.store_cover_url
          ? `url('${vendor.store_cover_url}')`
          : 'linear-gradient(135deg, var(--purple2), var(--purple1))';

        document.getElementById('store-category').textContent = vendor.store_category || '';
        // Every vendor this page can reach is already approved to sell
        // (the single-vendor endpoint 404s otherwise), that's separate
        // from having actually passed KYC document review
        // (vendor.kyc_verified), so this reflects the real outcome
        // instead of assuming every reachable storefront is verified.
        document.getElementById('store-verified-badge').innerHTML = verifiedBadgeMarkup(vendor.kyc_verified);

        const productsHeading = document.getElementById('store-products-heading');
        const productsGrid = document.getElementById('storeProductsGrid');
        let products = [];
        try {
          products = await VetraCatalog.load({ vendor: vendorId });
        } catch (err) {
          /* leave products empty on failure, the heading count still reflects that */
        }
        productsHeading.textContent = `FOR SALE (${products.length})`;
        // Same card renderer dashboard.html/explore.html use (assets/product-grid.js),
        // includes the qty stepper, handles badges/empty-state itself, so a
        // vendor's storefront grid looks and behaves identically to every
        // other product grid in the app instead of its own parallel markup.
        renderCustomerProductGrid(products, productsGrid, 'No products listed yet.');

        // ---- Reviews: real GET /api/vendors/:id/reviews ----
        let reviewsData = { average: null, count: 0, reviews: [] };
        try {
          reviewsData = await VetraAPI.request(`/vendors/${vendorId}/reviews`);
        } catch (err) {
          /* leave the empty default on failure */
        }

        const renderReviewSummary = () => CustomerReviews.renderSummary(
          reviewsData,
          'review-summary',
          'No reviews yet, be the first to review this store.'
        );
        const renderReviewList = () => CustomerReviews.renderList(reviewsData, 'reviewList');

        renderReviewSummary();
        renderReviewList();

        // Real purchase gate: the review form only appears for a signed-in
        // buyer with at least one completed order from this vendor, the
        // same rule POST /api/vendors/:id/reviews enforces server-side
        // (see backend/src/routes/reviews.routes.js). The first such order
        // found is what a submitted review attaches to; this UI doesn't
        // yet let a buyer pick a specific order to review.
        const reviewForm = document.getElementById('review-form');
        const reviewFormHint = document.getElementById('review-form-hint');
        let eligibleOrderId = null;

        if (VetraAPI.getToken('buyer')) {
          try {
            const myOrders = await VetraAPI.request('/orders/mine', { method: 'GET', role: 'buyer' });
            const eligible = myOrders.find((o) => o.vendor_id === vendorId && o.status === 'completed');
            if (eligible) eligibleOrderId = eligible.id;
          } catch (err) {
            /* leave eligibleOrderId null on failure, form stays hidden */
          }
        }

        if (eligibleOrderId) {
          reviewForm.hidden = false;
          reviewFormHint.textContent = "You've ordered from this vendor, share how it went.";
        } else {
          reviewForm.hidden = true;
          reviewFormHint.textContent = 'You can only review a vendor after a completed order with them.';
        }

        const starInput = document.getElementById('star-input');
        const starButtons = Array.from(starInput.querySelectorAll('.star-btn'));

        function setStars(value) {
          starInput.dataset.value = String(value);
          starButtons.forEach((btn) => {
            btn.classList.toggle('active', Number(btn.dataset.star) <= value);
          });
        }

        starButtons.forEach((btn) => {
          btn.addEventListener('click', () => setStars(Number(btn.dataset.star)));
        });

        document.getElementById('review-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const rating = Number(starInput.dataset.value);
          const textEl = document.getElementById('review-text');
          const text = textEl.value.trim();

          if (!rating) {
            CustomerUI.info({ title: 'Rating required', bodyHtml: 'Please select a star rating before submitting.' });
            return;
          }
          if (!text) {
            textEl.focus();
            return;
          }
          if (!eligibleOrderId) return;

          const submitBtn = reviewForm.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          try {
            await VetraAPI.request(`/vendors/${vendorId}/reviews`, {
              method: 'POST',
              role: 'buyer',
              body: { rating, text, orderId: eligibleOrderId },
            });
            reviewsData = await VetraAPI.request(`/vendors/${vendorId}/reviews`);
            renderReviewSummary();
            renderReviewList();
            setStars(0);
            textEl.value = '';
          } catch (err) {
            CustomerUI.info({ title: "Couldn't submit review", bodyHtml: err.message });
          } finally {
            submitBtn.disabled = false;
          }
        });
      });
    </script>
