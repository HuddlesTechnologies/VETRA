    <script>
      // ---------------------------------------------------------------
      // VETRA — VENDOR DIRECTORY (all vendors, searchable by name)
      // Reached from explore.html's "TOP VENDORS" rail — "See more" used
      // to be an inert button (see DOCUMENTATION.md's "inert See more
      // buttons" note); it now links here. Renders every vendor from the
      // real GET /api/vendors directory (assets/vendors.js) as a card
      // linking to store.html?vendor=<id>. Search re-queries the server
      // (?q=) instead of filtering an in-memory list, since the full
      // directory is no longer guaranteed to fit in one response forever.
      // Every vendor this endpoint returns is already approved to sell
      // (backend/src/routes/vendors.routes.js's status='active' filter) —
      // that's a separate thing from having actually passed KYC document
      // review (vendor.kyc_verified), so the pill reflects the real KYC
      // outcome rather than assuming every listed vendor is verified.
      // ---------------------------------------------------------------
      document.addEventListener('DOMContentLoaded', async function () {
        const grid = document.getElementById('vendorDirectoryGrid');
        const countEl = document.getElementById('vendorDirectoryCount');
        const emptyEl = document.getElementById('vendorDirectoryEmpty');
        const emptyQueryEl = document.getElementById('vendorDirectoryEmptyQuery');
        const searchInput = document.getElementById('vendorSearchInput');

        let vendors = [];
        let totalCount = 0;

        function renderCard(vendor) {
          const avatar = vendor.avatar_url || 'imgs/avatar-placeholder.svg';
          const rating = Number(vendor.rating || 0).toFixed(1);
          const kycPill = vendor.kyc_verified
            ? '<span class="status-pill verified">Verified</span>'
            : '<span class="status-pill pending">Not verified</span>';
          return `
            <a href="store.html?vendor=${vendor.id}" class="vendor-card" data-name="${(vendor.store_name || '').toLowerCase()}">
              <div class="vendor-card-avatar"><img src="${avatar}" alt="${vendor.store_name}" loading="lazy"></div>
              <div class="vendor-card-body">
                <div class="vendor-card-name-row">
                  <h4>${vendor.store_name}</h4>
                  ${kycPill}
                </div>
                <p class="vendor-card-category">${vendor.store_category || ''}</p>
                <p class="vendor-card-meta">★ ${rating} · ${vendor.address || 'Abuja'}</p>
              </div>
            </a>
          `;
        }

        async function render() {
          const query = searchInput.value.trim();
          try {
            vendors = await VetraVendorDirectory.load(query ? { q: query } : {});
          } catch (err) {
            grid.innerHTML = '';
            grid.hidden = true;
            emptyEl.hidden = false;
            emptyQueryEl.textContent = err.message;
            return;
          }
          if (!query) totalCount = vendors.length;

          grid.innerHTML = vendors.map(renderCard).join('');
          grid.hidden = vendors.length === 0;
          emptyEl.hidden = vendors.length > 0;
          if (vendors.length === 0) emptyQueryEl.textContent = searchInput.value.trim();

          countEl.textContent = query
            ? `Showing ${vendors.length} of ${totalCount} vendors`
            : `${totalCount} vendor${totalCount === 1 ? '' : 's'} on VETRA`;
        }

        let searchDebounce;
        searchInput.addEventListener('input', () => {
          clearTimeout(searchDebounce);
          searchDebounce = setTimeout(render, 250);
        });
        render();

        document.getElementById('vendors-back-btn').addEventListener('click', () => {
          if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
            window.history.back();
          } else {
            window.location.href = 'explore.html';
          }
        });
      });
    </script>
