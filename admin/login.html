<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VETRA · Admin Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../signup.css" />
  </head>
  <body>
    <div class="frame">
      <div class="topbar">
        <a href="../index.html" class="status logo"><img class="logo-img" src="../assets/brand/logo-full.png" alt="VETRA" /></a>
        <nav class="nav-links">
          <a href="../index.html">Home</a>
          <a href="../about.html">About</a>
          <a href="../contact.html">Contact</a>
        </nav>
      </div>

      <div class="panel-wrap">
        <div class="panel">
          <h1 class="title">Vetra <span class="highlight">Admin</span></h1>
          <p class="subtitle" id="admin-login-subtitle">Restricted access. Sign in with your admin credentials to continue.</p>

          <div class="form-grid" id="admin-login-form">
            <div class="field field-full">
              <label for="admin-email">Admin email</label>
              <div class="input-wrap">
                <input id="admin-email" type="email" placeholder="you@vetra.ng" />
              </div>
            </div>
            <div class="field field-full">
              <label for="admin-password">Password</label>
              <div class="input-wrap">
                <input id="admin-password" type="password" placeholder="Enter password" />
              </div>
            </div>
          </div>

          <!-- Shown instead of the form above once /auth/admin-signin
               responds with twoFactorRequired, see ../api-client.js and
               the inline script below. -->
          <div class="form-grid hidden" id="admin-2fa-form">
            <p style="font-size:13px; color:#8a93a5; margin:0 0 14px;">
              Enter the 6-digit code we emailed to <strong id="admin-2fa-email"></strong>.
            </p>
            <div class="field field-full">
              <label for="admin-2fa-code">Sign-in code</label>
              <div class="input-wrap">
                <input id="admin-2fa-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" />
              </div>
            </div>
          </div>

          <p class="form-error" id="admin-login-error" hidden style="color:#e0475c;font-size:13px;margin:0 0 12px;"></p>

          <button class="continue-btn" id="admin-continue-btn" type="button">Sign in to console <span class="btn-arrow">→</span></button>
          <button class="continue-btn hidden" id="admin-2fa-verify-btn" type="button">Verify code <span class="btn-arrow">→</span></button>

          <p class="footer-text hidden" id="admin-2fa-actions">
            <a href="#" id="admin-2fa-resend">Resend code</a> &middot; <a href="#" id="admin-2fa-back">Use a different account</a>
          </p>

          <p class="footer-text" id="admin-login-footer">
            Not an admin? <a href="../signin.html">Go to buyer/vendor sign in</a>
          </p>
        </div>
      </div>
    </div>

    <script src="../api-client.js"></script>
    <script src="../password-toggle.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const emailField = document.getElementById('admin-email');
        const passwordField = document.getElementById('admin-password');
        const continueBtn = document.getElementById('admin-continue-btn');
        const errorEl = document.getElementById('admin-login-error');

        const loginForm = document.getElementById('admin-login-form');
        const twoFactorForm = document.getElementById('admin-2fa-form');
        const twoFactorEmail = document.getElementById('admin-2fa-email');
        const codeField = document.getElementById('admin-2fa-code');
        const verifyBtn = document.getElementById('admin-2fa-verify-btn');
        const twoFactorActions = document.getElementById('admin-2fa-actions');
        const resendLink = document.getElementById('admin-2fa-resend');
        const backLink = document.getElementById('admin-2fa-back');
        const footer = document.getElementById('admin-login-footer');

        let pendingUserId = null;

        function showError(message) {
          errorEl.textContent = message;
          errorEl.hidden = false;
        }

        // Swaps the email/password step for the "enter the code we
        // emailed you" step, see /auth/admin-signin's twoFactorRequired
        // response (backend/src/routes/auth.routes.js).
        function enterTwoFactorStep(userId) {
          pendingUserId = userId;
          twoFactorEmail.textContent = emailField.value.trim();
          loginForm.classList.add('hidden');
          continueBtn.classList.add('hidden');
          footer.classList.add('hidden');
          twoFactorForm.classList.remove('hidden');
          verifyBtn.classList.remove('hidden');
          twoFactorActions.classList.remove('hidden');
          codeField.focus();
        }

        function backToPasswordStep() {
          pendingUserId = null;
          codeField.value = '';
          errorEl.hidden = true;
          twoFactorForm.classList.add('hidden');
          verifyBtn.classList.add('hidden');
          twoFactorActions.classList.add('hidden');
          loginForm.classList.remove('hidden');
          continueBtn.classList.remove('hidden');
          footer.classList.remove('hidden');
        }

        continueBtn.addEventListener('click', async () => {
          errorEl.hidden = true;
          let hasEmpty = false;
          [emailField, passwordField].forEach((f) => {
            const wrap = f.closest('.input-wrap');
            if (!f.value.trim()) {
              wrap.style.borderColor = '#e0475c';
              hasEmpty = true;
            } else {
              wrap.style.borderColor = '';
            }
          });
          if (hasEmpty) return;

          continueBtn.textContent = 'Signing in…';
          continueBtn.disabled = true;

          try {
            // Real authentication, a real password check against the live
            // backend, unlike the rest of this prototype's mock accounts.
            const data = await VetraAPI.request('/auth/admin-signin', {
              method: 'POST',
              body: { email: emailField.value.trim(), password: passwordField.value },
            });
            if (data.twoFactorRequired) {
              enterTwoFactorStep(data.userId);
              continueBtn.textContent = 'Sign in to console';
              continueBtn.disabled = false;
              return;
            }
            VetraAPI.setSession('admin', data.token, data.user);
            window.location.href = 'dashboard.html';
          } catch (err) {
            showError(err.message);
            continueBtn.textContent = 'Sign in to console';
            continueBtn.disabled = false;
          }
        });

        verifyBtn.addEventListener('click', async () => {
          errorEl.hidden = true;
          const code = codeField.value.trim();
          if (!code) {
            codeField.closest('.input-wrap').style.borderColor = '#e0475c';
            return;
          }

          verifyBtn.textContent = 'Verifying…';
          verifyBtn.disabled = true;

          try {
            const data = await VetraAPI.request('/auth/2fa/verify', {
              method: 'POST',
              body: { userId: pendingUserId, code },
            });
            VetraAPI.setSession('admin', data.token, data.user);
            window.location.href = 'dashboard.html';
          } catch (err) {
            showError(err.message);
            verifyBtn.textContent = 'Verify code';
            verifyBtn.disabled = false;
          }
        });

        resendLink.addEventListener('click', async (e) => {
          e.preventDefault();
          errorEl.hidden = true;
          resendLink.textContent = 'Sending…';
          try {
            await VetraAPI.request('/auth/2fa/resend', { method: 'POST', body: { userId: pendingUserId } });
            resendLink.textContent = 'Code sent';
            setTimeout(() => { resendLink.textContent = 'Resend code'; }, 4000);
          } catch (err) {
            showError(err.message);
            resendLink.textContent = 'Resend code';
          }
        });

        backLink.addEventListener('click', (e) => {
          e.preventDefault();
          backToPasswordStep();
        });
      });
    </script>
  </body>
</html>
