<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password · VETRA</title>
    <link rel="stylesheet" href="vetra-tokens.css" />
    <script src="theme.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div class="frame">
      <div class="topbar">
        <a href="index.html" class="status logo"><span class="vetra-logo"><img class="logo-img logo-for-light" src="assets/brand/logo-full.png" alt="VETRA" /><img class="logo-img logo-for-dark" src="assets/brand/logo-full-white.png" alt="" aria-hidden="true" /></span></a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>

      <div class="panel-wrap">
        <div class="panel">
          <div class="toggle" role="tablist" aria-label="Account type">
            <button class="active" type="button" data-role="buyer" role="tab" aria-selected="true">Buyer</button>
            <button type="button" data-role="vendor" role="tab" aria-selected="false">Vendor</button>
          </div>

          <h1 class="title">Forgot your <span class="highlight">password?</span></h1>
          <p class="subtitle" id="forgot-subtitle">Enter the email you signed up with and we'll send you a link to choose a new password.</p>

          <div class="form-grid" id="forgot-form-wrap">
            <div class="field field-full">
              <label for="forgot-email">Email address</label>
              <div class="input-wrap">
                <input id="forgot-email" type="email" autocomplete="email" placeholder="you@example.com" />
              </div>
            </div>
          </div>

          <p class="form-error" id="forgot-error" hidden style="color:var(--c-red);font-size:13px;margin:0 0 12px;"></p>
          <p class="form-error" id="forgot-success" hidden style="color:var(--c-green);font-size:13px;margin:0 0 12px;"></p>

          <button class="continue-btn" type="button" id="forgot-submit-btn">
            Send reset link <span class="btn-arrow">→</span>
          </button>

          <p class="footer-text">
            Remembered it? <a href="signin.html" id="forgot-back-link">Back to sign in</a>
          </p>
        </div>
      </div>
      <p class="built-by-strip"><a class="built-by" href="https://huddlestechnologies.com" target="_blank" rel="noopener">Built by Huddles Technologies</a></p>
    </div>
    <script src="api-client.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const toggleBtns = document.querySelectorAll(".toggle button");
        const emailInput = document.getElementById("forgot-email");
        const formWrap = document.getElementById("forgot-form-wrap");
        const submitBtn = document.getElementById("forgot-submit-btn");
        const errorEl = document.getElementById("forgot-error");
        const successEl = document.getElementById("forgot-success");
        const subtitleEl = document.getElementById("forgot-subtitle");
        const backLink = document.getElementById("forgot-back-link");
        const toggleWrap = document.querySelector(".toggle");

        // The same email can hold both a buyer and a vendor account, so the
        // role picks which one gets reset. Arrives preset from signin.html.
        let role = params.get("role") === "vendor" ? "vendor" : "buyer";

        function selectRole(next) {
          role = next;
          toggleBtns.forEach((b) => {
            const active = b.dataset.role === role;
            b.classList.toggle("active", active);
            b.setAttribute("aria-selected", active ? "true" : "false");
          });
          backLink.href = role === "vendor" ? "signin.html#Vendor" : "signin.html";
        }
        toggleBtns.forEach((b) => b.addEventListener("click", () => selectRole(b.dataset.role)));
        selectRole(role);
        if (params.get("email")) emailInput.value = params.get("email");

        function showError(message) {
          errorEl.textContent = message;
          errorEl.hidden = false;
        }

        async function submit() {
          errorEl.hidden = true;
          const email = emailInput.value.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showError("Enter a valid email address.");
            return;
          }

          submitBtn.textContent = "Sending…";
          submitBtn.disabled = true;
          try {
            const data = await VetraAPI.request("/auth/forgot-password", {
              method: "POST",
              body: { role, email },
            });
            formWrap.hidden = true;
            submitBtn.hidden = true;
            toggleWrap.classList.add("hidden");
            subtitleEl.textContent = "Check your email.";
            successEl.textContent = data.message + " The link expires in 1 hour. If it doesn't arrive, check your spam folder.";
            successEl.hidden = false;
          } catch (err) {
            showError(err.message);
            submitBtn.textContent = "Send reset link";
            submitBtn.disabled = false;
          }
        }

        submitBtn.addEventListener("click", submit);
        emailInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") submit();
        });
      })();
    </script>
  </body>
</html>
